<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – NetSentry AI Enterprise Security</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #f1f5f9;">

<div class="card shadow-sm border" style="width: 100%; max-width: 440px; border-radius: 12px;">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem; border-radius: 12px;">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">NetSentry AI</h3>
      <p class="text-muted small">Adaptive Network Behavior & Exfiltration Detection</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category != 'error' else 'danger' }} small py-2">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="username" id="usernameInput" class="form-control border-start-0 ps-0" placeholder="admin or analyst" required autofocus value="admin">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
          <input type="password" name="password" id="passwordInput" class="form-control border-start-0 ps-0" placeholder="••••••••" required value="admin123">
        </div>
      </div>

      <button type="submit" class="btn btn-ns-primary w-100 py-2 fw-semibold mb-3">
        Sign In to SOC Console
      </button>

      <div class="border-top pt-3 text-center">
        <span class="text-muted small d-block mb-2">Demo Credentials:</span>
        <div class="btn-group btn-group-sm w-100">
          <button type="button" class="btn btn-outline-secondary" onclick="setDemo('admin', 'admin123')">
            <i class="bi bi-shield-check"></i> Admin (admin123)
          </button>
          <button type="button" class="btn btn-outline-secondary" onclick="setDemo('analyst', 'analyst123')">
            <i class="bi bi-person-badge"></i> Analyst (analyst123)
          </button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  function setDemo(u, p) {
    document.getElementById('usernameInput').value = u;
    document.getElementById('passwordInput').value = p;
  }
</script>
</body>
</html>
